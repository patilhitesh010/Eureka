<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Eureka 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="eureka-bg-blink">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="500" height="500" style="fill: var(--primary); filter: drop-shadow(0 0 25px rgba(168,85,247,0.25));">
      <polygon points="45,20 155,20 155,50 45,50" />
      <polygon points="45,85 130,85 130,115 45,115" style="fill: var(--white);" />
      <polygon points="45,150 155,150 155,180 45,180" />
      <rect x="18" y="20" width="18" height="160" />
    </svg>
  </div>
  
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 62" width="220" height="62" class="eureka-logo-svg">
          <text x="50" y="10" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="6.5" fill="#a855f7" letter-spacing="0.5">E-CELL SIT'S</text>
          <rect x="5" y="26" width="5" height="15" fill="#a855f7" />
          <rect x="13" y="18" width="5" height="23" fill="#a855f7" />
          <rect x="21" y="10" width="5" height="31" fill="#a855f7" />
          <rect x="26" y="10" width="13" height="5" fill="#ffffff" />
          <rect x="26" y="23" width="9" height="5" fill="#ffffff" />
          <rect x="26" y="36" width="13" height="5" fill="#ffffff" />
          <text x="43" y="41" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1">UREKA</text>
          <rect x="200" y="10" width="5" height="21" fill="#ffffff" />
          <polygon points="200,35 205,35 204,41 199,41" fill="#ffffff" />
          <polygon points="21,46 165,46 161,54 21,54" fill="#ffffff" />
          <text x="27" y="52.5" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#000000" letter-spacing="0.2">WHERE VISION MEETS VENTURE</text>
          <text x="168" y="54" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="11" fill="#a855f7">2026</text>
        </svg>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container auth-container">
    <div class="card auth-card">
      <h2>Create Account</h2>
      <p class="subtitle">Register your student leader profile to form your competition team</p>

      <div id="alert-box"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="semester">Current Semester</label>
          <select id="semester" class="form-control" required>
            <option value="" disabled selected>Select Current Semester</option>
            <option value="Semester 1">Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4">Semester 4</option>
            <option value="Semester 5">Semester 5</option>
            <option value="Semester 6">Semester 6</option>
            <option value="Semester 7">Semester 7</option>
            <option value="Semester 8">Semester 8</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Register</button>
      </form>

      <p style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Log in here</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="container" style="text-align: center;">
      <p>&copy; 2026 Eureka Startup Competition. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Grab problem statement details from query params and store in sessionStorage
    const params = new URLSearchParams(window.location.search);
    const code = params.get('problem_code');
    const title = params.get('problem_title');
    if (code && title) {
      sessionStorage.setItem('preselected_problem_code', code);
      sessionStorage.setItem('preselected_problem_title', title);
    }

    // Redirect if already authenticated
    fetch((window.API_BASE || "") + '/api/auth/me')
      .then(res => {
        if (res.ok) return res.json();
      })
      .then(data => {
        if (data && data.user) {
          window.navigateTo(data.user.role === 'admin' ? 'admin.html' : 'dashboard.html');
        }
      });
  </script>
</body>
</html>
